<!--
  Magic link email. Used automatically by local Supabase (config.toml).
  For a hosted Supabase project, paste this into:
  Dashboard → Authentication → Emails → Magic Link  (see docs/SELF_HOSTING.md)
-->
<div style="background:#07070b;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4f4f5">
  <div style="max-width:420px;margin:0 auto;background:#111118;border:1px solid #26262f;border-radius:20px;padding:32px">
    <p style="margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#3dff9a">Paisa</p>
    <h1 style="margin:0 0 24px;font-size:22px;font-weight:600">Sign in</h1>
    <p style="margin:0 0 8px;color:#a1a1aa;font-size:14px">Enter this code in the app:</p>
    <p style="margin:0 0 24px;font-size:34px;font-weight:700;letter-spacing:.3em;color:#ffffff">{{ .Token }}</p>
    <p style="margin:0 0 16px;color:#a1a1aa;font-size:14px">or tap the button on this device:</p>
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#3dff9a;color:#07070b;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px">
      Sign in to Paisa
    </a>
    <p style="margin:24px 0 0;color:#71717a;font-size:12px">Didn't ask for this? You can ignore this email.</p>
  </div>
</div>
