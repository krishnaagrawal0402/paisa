name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    name: Fresh database setup works
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      ALLOWED_EMAILS: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start an empty Supabase Postgres
        run: npx supabase db start
      - name: Run the same deploy script Vercel runs
        run: npm run db:deploy
      - name: Lint the schema
        run: npx supabase db lint --local --fail-on error
      - name: Smoke-test sign-up lock and profile trigger
        run: node scripts/ci-db-check.mjs
